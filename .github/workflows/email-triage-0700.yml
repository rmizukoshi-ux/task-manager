name: Email triage 0700

on:
  schedule:
    # 平日 7:00 JST（月〜金）
    # JST = UTC+9 のため、7:00 JST = 前日 22:00 UTC
    # 月〜金 JST = 日〜木 UTC (0-4)
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

jobs:
  check-holiday:
    runs-on: ubuntu-latest
    outputs:
      is_holiday: ${{ steps.check.outputs.is_holiday }}
    steps:
      - name: 日本の祝日チェック
        id: check
        run: |
          # 実行日（JST）で祝日か判定
          JST_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://date.nager.at/api/v3/IsTodayPublicHoliday/JP?offset=9")
          if [ "$STATUS" = "200" ]; then
            echo "is_holiday=true" >> $GITHUB_OUTPUT
            echo "⛔ 祝日のためスキップ: $JST_DATE"
          else
            echo "is_holiday=false" >> $GITHUB_OUTPUT
            echo "✅ 営業日: $JST_DATE"
          fi

  run:
    needs: check-holiday
    if: needs.check-holiday.outputs.is_holiday != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Email triage 0700 を実行
        uses: anthropic-ai/claude-code-action@v1
        with:
          prompt: |
            朝のメールトリアージを実行してください。
            1. 未読メールを確認し、重要度・緊急度で分類する
            2. 要対応のメールにラベルを付ける
            3. スパム・不要メールをアーカイブする
            4. トリアージ結果をサマリーとして報告する
          allowed_tools: "mcp__gmail__*"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
