name: Email triage 0700

on:
  schedule:
    # 平日 7:00 JST = 22:00 UTC (前日)  月〜金 JST → 日〜木 UTC
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

jobs:
  email-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Email triage
        uses: anthropic-ai/claude-code-action@v1
        with:
          prompt: |
            朝のメールトリアージを実行してください。
            1. 未読メールを確認し、重要度・緊急度で分類する
            2. 要対応のメールにラベルを付ける
            3. スパム・不要メールをアーカイブする
            4. トリアージ結果をサマリーとして報告する
          allowed_tools: "mcp__gmail__*"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
